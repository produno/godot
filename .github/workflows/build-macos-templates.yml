name: Build macOS ARM64 Vulkan Export Templates

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      PCK_KEY: ${{ secrets.PCK_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install scons
          brew install llvm
          brew install molten-vk

      - name: Build release template (arm64, Vulkan)
        run: |
          scons platform=macos \
                target=template_release \
                arch=arm64 \
                vulkan_sdk_path=/opt/homebrew/opt/molten-vk \
                pck_encryption_key="${PCK_KEY}"

      - name: Build debug template (arm64, Vulkan)
        run: |
          scons platform=macos \
                target=template_debug \
                arch=arm64 \
                vulkan_sdk_path=/opt/homebrew/opt/molten-vk \
                pck_encryption_key="${PCK_KEY}"

      - name: Upload templates
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-vulkan-templates
          path: bin/*
