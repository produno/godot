name: Build macOS Export Templates (ARM64 Vulkan + x86_64 GLES3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      PCK_KEY: ${{ secrets.PCK_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install scons
          brew install llvm
          brew install molten-vk

      # ---------------------------------------------------------
      # Apple Silicon (ARM64) — Vulkan — Forward+ — HDR supported
      # ---------------------------------------------------------
      - name: Build ARM64 Release (Vulkan)
        run: |
          scons platform=macos \
                target=template_release \
                arch=arm64 \
                vulkan_sdk_path=/opt/homebrew/opt/molten-vk \
                pck_encryption_key="${PCK_KEY}"

      - name: Build ARM64 Debug (Vulkan)
        run: |
          scons platform=macos \
                target=template_debug \
                arch=arm64 \
                vulkan_sdk_path=/opt/homebrew/opt/molten-vk \
                pck_encryption_key="${PCK_KEY}"

      # ---------------------------------------------------------
      # Intel (x86_64) — GLES3 — Compatibility — No HDR
      # ---------------------------------------------------------
      - name: Build x86_64 Release (GLES3 only)
        run: |
          scons platform=macos \
                target=template_release \
                arch=x86_64 \
                vulkan=no \
                pck_encryption_key="${PCK_KEY}"

      - name: Build x86_64 Debug (GLES3 only)
        run: |
          scons platform=macos \
                target=template_debug \
                arch=x86_64 \
                vulkan=no \
                pck_encryption_key="${PCK_KEY}"

      # ---------------------------------------------------------
      # Upload all templates
      # ---------------------------------------------------------
      - name: Upload templates
        uses: actions/upload-artifact@v4
        with:
          name: macos-templates-arm64-vulkan-and-x86_64-gles3
          path: bin/*
